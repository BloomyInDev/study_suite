on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-api:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: forge.red.bloomyindev.me
          username: bastien
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: forge.red.bloomyindev.me/bastien/study_suite_api:latest

  build-web:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: forge.red.bloomyindev.me
          username: bastien
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_GIT_COMMIT_HASH=${{ github.sha }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: forge.red.bloomyindev.me/bastien/study_suite_web:latest

  build-scraper:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: forge.red.bloomyindev.me
          username: bastien
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push scraper
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/scraper/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: forge.red.bloomyindev.me/bastien/study_suite_scraper:latest

  build-migrate:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: forge.red.bloomyindev.me
          username: bastien
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: forge.red.bloomyindev.me/bastien/study_suite_migrate:latest
