<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Study Suite">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f2a4d" />
            <stop offset="1" stop-color="#1867c0" />
        </linearGradient>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2979d4" />
            <stop offset="1" stop-color="#1867c0" />
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)" />

    <!-- the favicon mark, scaled from its 64px grid -->
    <g transform="translate(96 210) scale(2.5)">
        <rect width="64" height="64" rx="14" fill="url(#tile)" />
        <rect x="12" y="12" width="16" height="26" rx="4" fill="#ffffff" />
        <rect x="36" y="12" width="16" height="14" rx="4" fill="#ffffff" opacity=".6" />
        <rect x="12" y="44" width="16" height="8" rx="4" fill="#ffffff" opacity=".6" />
        <rect x="36" y="32" width="16" height="20" rx="4" fill="#ffb300" />
    </g>

    <g font-family="DejaVu Sans, Roboto, Helvetica, Arial, sans-serif">
        <text x="352" y="323" fill="#ffffff" font-size="86" font-weight="bold">Study Suite</text>
        <text x="352" y="391" fill="#c7dcf6" font-size="36">Emploi du temps, devoirs et salles de l'IUT</text>
    </g>

    <rect x="352" y="431" width="120" height="8" rx="4" fill="#ffb300" />
</svg>
