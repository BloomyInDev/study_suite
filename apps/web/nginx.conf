server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain application/xml;
    gzip_min_length 1024;

    # The api owns /api entirely — health, docs, auth and every resource — so no
    # route added later needs a change here. Its 404s are real 404s and reach the
    # caller untouched.
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Transitional: Discord still redirects to the pre-/api callback until the
    # developer portal entry is updated. Exact match, so /auth/callback (a SPA
    # route) is untouched. Remove once the portal points at /api/auth/...
    location = /auth/discord/callback {
        proxy_pass         http://api:3000/auth/discord/callback;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # index.html is the one unhashed file, and it is what names the hashed
    # assets, so a cached copy keeps a browser on the previous deploy's bundle
    # indefinitely. Without this it carries no Cache-Control at all and browsers
    # fall back to guessing from Last-Modified. no-cache still stores it, it just
    # has to revalidate, so the usual answer is a 304.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else is the SPA, plus the icons and the manifest. Those keep
    # their names across deploys, so like index.html they revalidate rather
    # than being frozen: a replaced favicon reaches people who already have one.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets. Scoped to /assets/ rather than matched
    # by extension: only what vite fingerprints can be immutable, and an icon at
    # the root is a .svg or .png too.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
