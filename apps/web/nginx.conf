server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain application/xml;
    gzip_min_length 1024;

    # The api owns /api entirely — health, docs, auth and every resource — so no
    # route added later needs a change here. Its 404s are real 404s and reach the
    # caller untouched.
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Transitional: Discord still redirects to the pre-/api callback until the
    # developer portal entry is updated. Exact match, so /auth/callback (a SPA
    # route) is untouched. Remove once the portal points at /api/auth/...
    location = /auth/discord/callback {
        proxy_pass         http://api:3000/auth/discord/callback;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # index.html is the one unhashed file, and it is what names the hashed
    # assets, so a cached copy keeps a browser on the previous deploy's bundle
    # indefinitely. Without this it carries no Cache-Control at all and browsers
    # fall back to guessing from Last-Modified. no-cache still stores it, it just
    # has to revalidate, so the usual answer is a 304.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # A file that exists is served as is: the icons, the manifest, sw.js,
    # robots.txt. Those keep their names across deploys, so like index.html they
    # revalidate rather than being frozen: a replaced favicon reaches people who
    # already have one. Every other path is a page, rendered by the api.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri @ssr;
    }

    # "/" is a directory, which try_files counts as found, so it would never
    # reach @ssr. error_page is the one way to jump to a named location. That
    # makes @ssr's own fallback a second error_page, which nginx only follows
    # when the first jump allowed it, hence the flag here and not there.
    location = / {
        recursive_error_pages on;
        error_page 418 = @ssr;
        return 418;
    }

    # Pages are rendered per request (apps/api/src/lib/ssr.ts), so the head can
    # depend on the query string. Any failure, including the api being down or
    # rendering being unconfigured (503), serves the page vite-ssg built
    # instead: the worst case is the site as it was before rendering existed.
    location @ssr {
        proxy_pass            http://api:3000;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        # A render takes tens of milliseconds; anything slower is a fault, and
        # the static page is a better answer than a long wait.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static;
    }

    # $uri/index.html rather than $uri/: vite-ssg renders /planning to
    # planning/index.html, and matching the directory makes nginx 301 to
    # /planning/ — a redirect away from the URL the router and the canonical
    # tag both use, and one nginx builds with its own scheme and host, so
    # behind a TLS-terminating proxy it points back at http://.
    location @static {
        add_header Cache-Control "no-cache";
        try_files $uri/index.html /index.html;
    }

    # Long-lived cache for hashed assets. Scoped to /assets/ rather than matched
    # by extension: only what vite fingerprints can be immutable, and an icon at
    # the root is a .svg or .png too.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
