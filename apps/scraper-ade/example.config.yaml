# Scraper configuration
# Copy this file to config.yaml and adjust for your environment.
# cp example.config.yaml config.yaml
# All values can be set here. Env vars take precedence when defined.

database:
    # url: postgres://user:pass@localhost:5432/study_suite

scrape:
    # The Prose Consult /direct/?data=... planning URL. The data blob is the
    # credential: it encodes which groups the feed covers.
    # url: https://...
    intervalMs: 1800000
    # How far back and forward to reconcile, in days. Only weeks of the
    # planning's current academic year are fetched; the rest are left alone.
    pastDays: 30
    futureDays: 365
