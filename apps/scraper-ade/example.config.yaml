# Scraper configuration
# Copy this file to config.yaml and adjust for your environment.
# cp example.config.yaml config.yaml
# All values can be set here. Env vars take precedence when defined.

database:
    # url: postgres://user:pass@localhost:5432/study_suite

scrape:
    # The Prose Consult /direct/?data=... planning URL. The data blob is the
    # credential: it encodes which groups the feed covers.
    # url: https://...
    intervalMs: 1800000
    # How far back and forward to reconcile, in days. Only weeks of the
    # planning's current academic year are fetched; the rest are left alone.
    pastDays: 30
    futureDays: 365
    # A resources.json from the proseconsult toolkit ([{ id, path, name }]).
    # Set, every resource in it is scraped, the whole IUT, not only the groups
    # the data= blob covers. Once set, never unset it: a run without it reads
    # every other department's course as cancelled. See AGENTS.md.
    # The image ships the 2026-27 map at this path (apps/scraper-ade/resources.json).
    # resourceMap: /app/apps/scraper-ade/resources.json
    # Weeks per ADE call. A year of 60 groups at once times out (504).
    weeksPerCall: 8
