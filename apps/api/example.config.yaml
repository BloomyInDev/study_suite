# API configuration
# Copy this file to config.yaml and adjust for your environment.
# cp example.config.yaml config.yaml
# All values can be set here. Env vars take precedence when defined.

server:
    port: 3000
    # corsOrigin: http://localhost:5173

database:
    # url: postgres://user:pass@localhost:5432/study_suite

discord:
    # clientId: "your_discord_app_client_id"
    # clientSecret: "your_discord_app_client_secret"
    # guildId: "your_discord_server_id"
    # redirectUri: http://localhost:3000/api/auth/discord/callback

# The department LDAP<->OIDC bridge. Leave the whole block out to disable the
# "Connexion avec l'IUT" button; the api boots fine without it.
iut:
    # Shown on the login button and the admin pages. Defaults to "IUT".
    # displayName: "Dép. Info."
    # issuerUrl: https://webinfo.iutmontp.univ-montp2.fr/~loynetr/ldap-gateway/public
    # clientId: "your_bridge_client_id"
    # clientSecret: "your_bridge_client_secret"
    # redirectUri: http://localhost:3000/api/auth/iut/callback

jwt:
    # secret: "a_random_secret_at_least_32_characters_long"

# Web Push, for the course reminders. Leave the whole block out and the
# /api/push routes answer 503, the reminder ticker never starts, and the web app
# hides the toggle — the api boots fine without it.
#
# Generate a keypair once, then keep it:
#   pnpm -F @studysuite/api exec web-push generate-vapid-keys
#
# The pair is an identity, not a rotating secret. Every browser subscription is
# bound to the public key it was created with, so replacing it silently stops
# delivery to everyone already subscribed.
push:
    # publicKey: "BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkTuk1cCLEQ"
    # privateKey: "your_vapid_private_key"
    # Where a push service can reach you about a misbehaving sender.
    # subject: "mailto:admin@example.com"

# Keys for Discord bots (each at least 32 characters). Leave the block out and
# the /api/bot routes answer 503 and `Authorization: Bot …` is refused.
#
# A key lets its bot act as any user who has a linked Discord account, by
# sending `X-Acting-Discord-User: <discord id>` — so guard them like jwt.secret.
# Give each bot its own key so one can be revoked alone. As an env var:
# BOT_API_KEYS=key1,key2
#   openssl rand -hex 32
bot:
    # apiKeys:
    #     - "a_random_key_at_least_32_characters_long"
