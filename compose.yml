services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: study_suite
        ports:
            - '5432:5432'
        volumes:
            # postgres:18 sets PGDATA=/var/lib/postgresql/18/docker and declares its
            # volume at /var/lib/postgresql — mounting .../data would persist nothing.
            - ./data/postgres:/var/lib/postgresql
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    migrate:
        image: forge.red.bloomyindev.me/bastien/study_suite_migrate:latest
        build:
            context: .
            dockerfile: packages/db/Dockerfile
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/study_suite
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - backend
        restart: 'no'

    api:
        image: forge.red.bloomyindev.me/bastien/study_suite_api:latest
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/study_suite
            PORT: 3000
            CORS_ORIGIN: '*'
            CONFIG_PATH: /config.yaml
        volumes:
            # Required — create api.config.yaml next to this file.
            # See apps/api/example.config.yaml. The api exits if it is missing.
            - ./api.config.yaml:/config.yaml:ro
        # No host port: the external proxy hits web:80 and nginx routes /api/
        # and /auth/ here over the frontend network.
        expose:
            - '3000'
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - backend
            - frontend

    web:
        image: forge.red.bloomyindev.me/bastien/study_suite_web:latest
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            args:
                # docker compose build GIT_COMMIT=$(git rev-parse HEAD) to stamp it
                VITE_GIT_COMMIT_HASH: ${GIT_COMMIT:-unknown}
            # Override VITE_API_URL here if the API is on a different public URL
            #   VITE_API_URL: https://api.example.com
        ports:
            - '80:80'
        depends_on:
            - api
        networks:
            - frontend

    scraper:
        image: forge.red.bloomyindev.me/bastien/study_suite_scraper:latest
        build:
            context: .
            dockerfile: apps/scraper/Dockerfile
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/study_suite
            CONFIG_PATH: /config.yaml
            SCRAPE_DEBUG_DIR: /debug
        volumes:
            # Required — create scraper.config.yaml next to this file.
            # See apps/scraper/example.config.yaml. The scraper exits if it is missing.
            - ./scraper.config.yaml:/config.yaml:ro
            # Screenshots written when a scrape fails.
            - ./debug:/debug
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - backend
            - egress
        # Long-lived: the scraper schedules its own reruns on scrape.intervalMs.
        # One-shot pass to test the setup (scrapes once, exits, removes the
        # container — exit code 1 if the scrape failed):
        #   docker compose run --rm scraper pnpm -F @studysuite/scraper scrape
        restart: unless-stopped

networks:
    # Lets nginx resolve and reach `api` for its /api/ and /auth/ proxy_pass.
    # Not internal: the reverse proxy lives on another host and reaches web
    # through the published :80, and api needs egress for the Discord OAuth
    # token exchange. (A container only on an internal network cannot serve a
    # published port.)
    frontend:

    # Database segment. internal:true — no route off the host, so nothing here
    # can reach (or be reached from) the internet.
    backend:
        internal: true

    # The scraper sits on backend for the DB, and needs its own way out to
    # reach Prose Consult since backend is internal.
    egress:
