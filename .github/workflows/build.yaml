name: Build images

on:
    push:
        branches:
            - main
            # Preview env. Only main publishes `:latest`; this branch, and a
            # manual run from any other, publishes `:staging`.
            - staging
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: api
                      dockerfile: apps/api/Dockerfile
                    - name: web
                      dockerfile: apps/web/Dockerfile
                      build-args: VITE_GIT_COMMIT_HASH=${{ github.sha }}
                    - name: scraper
                      dockerfile: apps/scraper/Dockerfile
                    - name: scraper-ade
                      dockerfile: apps/scraper-ade/Dockerfile
                    - name: migrate
                      dockerfile: packages/db/Dockerfile

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push ${{ matrix.name }}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  build-args: ${{ matrix.build-args }}
                  push: true
                  provenance: false
                  platforms: linux/amd64
                  tags: ghcr.io/bloomyindev/study_suite/${{ matrix.name }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
                  # Says which commit an image was built from. Without them the
                  # only labels are the base image's: `api` reports Bun's own
                  # revision and version, and nothing on a host tells a `:latest`
                  # from the one before it. The descriptive ones are set too, or
                  # the base's would show through next to our revision. `created`
                  # and `licenses` are still the base image's.
                  labels: |
                      org.opencontainers.image.title=study_suite/${{ matrix.name }}
                      org.opencontainers.image.description=Study Suite ${{ matrix.name }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    # The preview stack follows the `staging` branch on its own: once every
    # image is pushed, the host pulls them and restarts. Only for a push to
    # `staging` itself. A manual run from another branch publishes `:staging`
    # too, but deploying that is a decision, not a side effect.
    deploy-staging:
        needs: build
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        runs-on: ubuntu-latest
        # Talks to the host and nothing else: no token rights at all.
        permissions: {}
        steps:
            - name: Deploy the preview stack
              env:
                  SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
                  SSH_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
                  SSH_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
                  SSH_USER: ${{ secrets.STAGING_DEPLOY_USER }}
                  SSH_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
              run: |
                  # A fork, or a repo nobody gave the key to, has nothing to
                  # deploy to. Say so instead of failing every build there.
                  if [ -z "$SSH_KEY" ]; then
                      echo "::warning::STAGING_DEPLOY_SSH_KEY is not set, the preview stack was not deployed"
                      exit 0
                  fi
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  # The host key is pinned, never learnt on first contact: the
                  # runner is new every time, so trusting what answers would
                  # verify nothing.
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  # The key's forced command on the host is deploy/staging.sh.
                  # The host ignores what is asked for here, so there is
                  # nothing to pass: no branch, no tag, no file.
                  ssh -i ~/.ssh/deploy -p "$SSH_PORT" \
                      -o IdentitiesOnly=yes -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                      "$SSH_USER@$SSH_HOST" deploy
