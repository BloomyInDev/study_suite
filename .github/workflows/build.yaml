name: Build images

on:
    push:
        branches:
            - main
            # Preview env. Only main publishes `:latest`; this branch, and a
            # manual run from any other, publishes `:staging`.
            - staging
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: api
                      dockerfile: apps/api/Dockerfile
                    - name: web
                      dockerfile: apps/web/Dockerfile
                      build-args: VITE_GIT_COMMIT_HASH=${{ github.sha }}
                    - name: scraper
                      dockerfile: apps/scraper/Dockerfile
                    - name: scraper-ade
                      dockerfile: apps/scraper-ade/Dockerfile
                    - name: migrate
                      dockerfile: packages/db/Dockerfile

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push ${{ matrix.name }}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  build-args: ${{ matrix.build-args }}
                  push: true
                  provenance: false
                  platforms: linux/amd64
                  tags: ghcr.io/bloomyindev/study_suite/${{ matrix.name }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
                  # Says which commit an image was built from. Without them the
                  # only labels are the base image's: `api` reports Bun's own
                  # revision and version, and nothing on a host tells a `:latest`
                  # from the one before it. The descriptive ones are set too, or
                  # the base's would show through next to our revision. `created`
                  # and `licenses` are still the base image's.
                  labels: |
                      org.opencontainers.image.title=study_suite/${{ matrix.name }}
                      org.opencontainers.image.description=Study Suite ${{ matrix.name }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}
