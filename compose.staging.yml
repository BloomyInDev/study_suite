# Preview env: the `staging` branch's images, beside production on the same host.
#
# Throwaway by design. Postgres lives on a tmpfs, so every `down` or restart
# starts from an empty database, which scraper-ade refills on its first run.
# Nothing here reads or writes production's data: separate project, separate
# networks, no published database port.
#
# Deploy from its own directory, under its own project name:
#   docker compose -p study_staging pull && docker compose -p study_staging up -d
#
# The mem limits keep a misbehaving preview from starving production, which
# shares this 2 GB LXC.

services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: study_suite
        # RAM, not disk: a full scrape is well under 100 MB.
        tmpfs:
            - /var/lib/postgresql:size=256m
        mem_limit: 512m
        # Comes back empty after a restart (tmpfs): `migrate` and
        # `staging-seed` rebuild it within a minute.
        restart: unless-stopped
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    # Long-lived here, unlike production's one-shot: Postgres restarts empty,
    # and on a host reboot Docker ignores depends_on, so a single run at `up`
    # would leave the database without tables. Migrating is idempotent, so it
    # simply runs again every minute.
    migrate:
        image: ghcr.io/bloomyindev/study_suite/migrate:staging
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/study_suite
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
                while true; do
                    pnpm --filter @studysuite/db run db:migrate > /dev/null \
                        && touch /tmp/migrated \
                        || echo "[migrate] failed, retrying"
                    sleep 60
                done
        # Healthy once the first run has succeeded; the services below wait on it.
        healthcheck:
            test: ['CMD', 'test', '-f', '/tmp/migrated']
            interval: 60s
            start_period: 120s
            start_interval: 2s
        mem_limit: 256m
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - backend
        restart: unless-stopped

    api:
        image: ghcr.io/bloomyindev/study_suite/api:staging
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/study_suite
            PORT: 3000
            CORS_ORIGIN: '*'
            CONFIG_PATH: /config.yaml
        volumes:
            # Its own file, not production's: a different jwt.secret and the
            # preview's own OAuth redirect URIs.
            - ./api.config.yaml:/config.yaml:ro
        expose:
            - '3000'
        mem_limit: 256m
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_healthy
        networks:
            - backend
            - frontend
        restart: unless-stopped

    web:
        image: ghcr.io/bloomyindev/study_suite/web:staging
        environment:
            SITE_URL: ${SITE_URL:-https://study-staging.bastienluben.dev}
        # Production holds :80. The front proxy sends study-staging.bastienluben.dev here.
        ports:
            - '3000:80'
        mem_limit: 64m
        depends_on:
            - api
        networks:
            - frontend
        restart: unless-stopped

    scraper-ade:
        image: ghcr.io/bloomyindev/study_suite/scraper-ade:staging
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/study_suite
            CONFIG_PATH: /config.yaml
            # POST /scrape runs a scrape now. Unauthenticated: never publish it.
            SCRAPE_TRIGGER_PORT: 8081
        expose:
            - '8081'
        volumes:
            # A copy of production's: only scrape.url is read, and the
            # DATABASE_URL above overrides database.url.
            - ./scraper.config.yaml:/config.yaml:ro
        mem_limit: 512m
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_healthy
        networks:
            - backend
            - egress
        restart: unless-stopped

    # Puts back what the tmpfs loses on every restart: the group hierarchy,
    # everyone approved, and admin for the Discord ids in ADMIN_DISCORD_IDS
    # (comma-separated, set in the stack's .env). Re-applied every 10 s, so a
    # new login is approved within seconds and a Postgres restart heals itself.
    # An empty events table asks scraper-ade for a scrape, once per wipe.
    # By hand:
    #   docker compose -p study_staging exec staging-seed \
    #       wget -qO- --post-data= http://scraper-ade:8081/scrape
    staging-seed:
        image: postgres:18-alpine
        environment:
            PGHOST: postgres
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: study_suite
            ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
        configs:
            - source: staging-seed-sql
              target: /seed.sql
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
                asked=0
                while true; do
                    psql -q -v ON_ERROR_STOP=1 -v admins="$$ADMIN_DISCORD_IDS" -f /seed.sql \
                        || echo "[staging-seed] seed failed, retrying"
                    events=$$(psql -At -c 'SELECT count(*) FROM events' 2>/dev/null)
                    if [ "$$events" = 0 ] && [ "$$asked" = 0 ]; then
                        wget -qO- --post-data= http://scraper-ade:8081/scrape \
                            && echo "[staging-seed] events empty, scrape requested" && asked=1
                    elif [ -n "$$events" ] && [ "$$events" != 0 ]; then
                        asked=0
                    fi
                    sleep 10
                done
        mem_limit: 32m
        depends_on:
            migrate:
                condition: service_healthy
        networks:
            - backend
        restart: unless-stopped

configs:
    staging-seed-sql:
        # Production's hierarchy, by name: ids differ between the two
        # databases. Exported from prod on 2026-09-27. The scraper finds these
        # groups by name, so creating them ahead of the first scrape is fine.
        content: |
            CREATE TEMP TABLE links (parent text, child text);
            INSERT INTO links VALUES
                ('BUT 1A PROMO', 'A1-Semestre-1'), ('BUT 2A PROMO', 'A2-Semestre-3'),
                ('BUT 3A PROMO', 'A3-Semestre-5'),
                ('A1-Semestre-1', 'S1'), ('A1-Semestre-1', 'S2'), ('A1-Semestre-1', 'S3'),
                ('A1-Semestre-1', 'S4'), ('A1-Semestre-1', 'S5'), ('A1-Semestre-1', 'S6'),
                ('A1-Semestre-1', 'Sète'),
                ('A2-Semestre-3', 'Q-Sète'), ('A2-Semestre-3', 'Q1'), ('A2-Semestre-3', 'Q2'),
                ('A2-Semestre-3', 'Q3'), ('A2-Semestre-3', 'Q4'),
                ('A3-Semestre-5', 'G-Sète'), ('A3-Semestre-5', 'G1'), ('A3-Semestre-5', 'G2'),
                ('A3-Semestre-5', 'G3'), ('A3-Semestre-5', 'G4'),
                ('S1', 'S1a'), ('S1', 'S1b'), ('S2', 'S2a'), ('S2', 'S2b'),
                ('S3', 'S3a'), ('S3', 'S3b'), ('S4', 'S4a'), ('S4', 'S4b'),
                ('S5', 'S5a'), ('S5', 'S5b'), ('S6', 'S6a'), ('S6', 'S6b'),
                ('Sète', 'SèteA'), ('Sète', 'SèteB');

            INSERT INTO student_groups (internal_name)
            SELECT parent FROM links UNION SELECT child FROM links
            ON CONFLICT DO NOTHING;

            -- The promo parents only exist in prod because an admin made them.
            UPDATE student_groups SET display_name = v.display
            FROM (VALUES ('BUT 1A PROMO', 'BUT1'), ('BUT 2A PROMO', 'BUT2'),
                         ('BUT 3A PROMO', 'BUT3')) v(name, display)
            WHERE internal_name = v.name AND display_name IS NULL;

            INSERT INTO student_group_memberships (parent_id, child_id)
            SELECT p.id, c.id FROM links l
            JOIN student_groups p ON p.internal_name = l.parent
            JOIN student_groups c ON c.internal_name = l.child
            ON CONFLICT DO NOTHING;

            UPDATE users SET status = 'approved' WHERE status <> 'approved';

            UPDATE users u SET is_admin = true
            FROM user_identities i
            WHERE i.user_id = u.id AND i.provider = 'discord' AND NOT u.is_admin
              AND i.subject = ANY (string_to_array(:'admins', ','));

networks:
    frontend:
    backend:
        internal: true
    egress:
